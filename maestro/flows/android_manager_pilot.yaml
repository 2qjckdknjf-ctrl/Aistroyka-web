# AiStroyka Manager (Android) — login → reports → first report → Approve (if submitted)
appId: ai.aistroyka.manager
---
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: pilot_manager_email
    timeout: 45000
- tapOn:
    id: pilot_manager_email
- inputText: ${SMOKE_EMAIL}
- hideKeyboard
- tapOn:
    id: pilot_manager_password
- inputText: ${SMOKE_PASSWORD}
- hideKeyboard
- tapOn:
    id: pilot_manager_sign_in
- extendedWaitUntil:
    visible:
      id: pilot_manager_reports_inbox
    timeout: 90000
- tapOn:
    id: pilot_manager_reports_inbox
- waitForAnimationToEnd
# Wait for async loadReports; do not assert "Home" alone (button can appear before list fills).
- extendedWaitUntil:
    visible:
      id: pilot_manager_report_row_0
    timeout: 120000
- tapOn:
    id: pilot_manager_report_row_0
- extendedWaitUntil:
    visible: "Report "
    timeout: 30000
- tapOn:
    id: pilot_manager_approve
    optional: true
