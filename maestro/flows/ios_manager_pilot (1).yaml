# AiStroyka Manager (iOS Simulator) — login → Reports tab → first row → Approve (optional)
appId: ai.aistroyka.manager
---
- launchApp
- extendedWaitUntil:
    visible:
      id: pilot_manager_email
    timeout: 45000
- tapOn:
    id: pilot_manager_email
- inputText: ${SMOKE_EMAIL}
- hideKeyboard
- tapOn:
    id: pilot_manager_password
- inputText: ${SMOKE_PASSWORD}
- hideKeyboard
- tapOn:
    id: pilot_manager_sign_in
- extendedWaitUntil:
    visible: "AiStroyka Manager"
    timeout: 90000
- tapOn: "Reports"
- extendedWaitUntil:
    visible:
      id: pilot_manager_report_row_0
    timeout: 120000
- tapOn:
    id: pilot_manager_report_row_0
- extendedWaitUntil:
    visible: "Report"
    timeout: 30000
- tapOn:
    id: pilot_manager_approve
    optional: true
