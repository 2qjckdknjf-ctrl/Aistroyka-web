# Layer B — live pilot iOS UITests (Manager intelligence/copilot + reports; Worker report draft).
# Requires macOS runner + repository secrets (Settings → Secrets → Actions):
#   PILOT_E2E_EMAIL, PILOT_E2E_PASSWORD (or PILOT_SMOKE_EMAIL_PRODUCTION / PILOT_SMOKE_PASSWORD_PRODUCTION)
#   NEXT_PUBLIC_SUPABASE_URL_PRODUCTION, NEXT_PUBLIC_SUPABASE_ANON_KEY_PRODUCTION
# Optional: PILOT_E2E_BASE_URL (default https://aistroyka.ai), PILOT_E2E_PROJECT_ID
#
# Manual only — workflow_dispatch (not on PR path; simulator + live tenant; ~15 min).
name: iOS Layer B E2E (live pilot)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Pilot API base URL (no trailing slash)"
        required: false
        default: "https://aistroyka.ai"
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/ios-e2e-integration.yml

concurrency:
  group: ios-e2e-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-only-placeholder:
    name: Manual dispatch only (skip on push)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Run this workflow manually from the Actions tab (workflow_dispatch)."

  ios-layer-b:
    name: Mobile API chain + live UITests
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require pilot E2E secrets
        env:
          EMAIL: ${{ secrets.PILOT_E2E_EMAIL || secrets.PILOT_SMOKE_EMAIL_PRODUCTION }}
          PASS: ${{ secrets.PILOT_E2E_PASSWORD || secrets.PILOT_SMOKE_PASSWORD_PRODUCTION }}
          SUPA_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PRODUCTION }}
          SUPA_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_PRODUCTION }}
        run: |
          if [ -z "$EMAIL" ] || [ -z "$PASS" ] || [ -z "$SUPA_URL" ] || [ -z "$SUPA_KEY" ]; then
            echo "::error::Set PILOT_E2E_EMAIL/PILOT_E2E_PASSWORD or PILOT_SMOKE_EMAIL_PRODUCTION/PILOT_SMOKE_PASSWORD_PRODUCTION, plus NEXT_PUBLIC_SUPABASE_URL_PRODUCTION and NEXT_PUBLIC_SUPABASE_ANON_KEY_PRODUCTION."
            exit 1
          fi

      - name: Resolve pilot base URL
        id: pilot
        env:
          DISPATCH_BASE: ${{ github.event.inputs.base_url }}
          SECRET_BASE: ${{ secrets.PILOT_E2E_BASE_URL }}
        run: |
          BASE="${DISPATCH_BASE:-$SECRET_BASE}"
          BASE="${BASE:-https://aistroyka.ai}"
          echo "base_url=$BASE" >> "$GITHUB_OUTPUT"

      - name: Write ios/Config/Secrets.xcconfig for CI
        env:
          BASE_URL: ${{ steps.pilot.outputs.base_url }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PRODUCTION }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_PRODUCTION }}
        run: |
          set -eo pipefail
          xc_escape() { printf '%s' "$1" | sed 's/\//\\\/\\/g'; }
          BASE_ESC="$(xc_escape "$BASE_URL")"
          SUPA_ESC="$(xc_escape "$SUPABASE_URL")"
          umask 077
          {
            printf 'BASE_URL = %s\n' "$BASE_ESC"
            printf 'SUPABASE_URL = %s\n' "$SUPA_ESC"
            printf 'SUPABASE_ANON_KEY = %s\n' "$SUPABASE_ANON_KEY"
          } > ios/Config/Secrets.xcconfig

      - name: Xcode version
        run: xcodebuild -version

      - name: Mobile API chain (Layer B preflight)
        env:
          BASE_URL: ${{ steps.pilot.outputs.base_url }}
          SMOKE_EMAIL: ${{ secrets.PILOT_E2E_EMAIL || secrets.PILOT_SMOKE_EMAIL_PRODUCTION }}
          SMOKE_PASSWORD: ${{ secrets.PILOT_E2E_PASSWORD || secrets.PILOT_SMOKE_PASSWORD_PRODUCTION }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PRODUCTION }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_PRODUCTION }}
        run: bash scripts/smoke/ios_mobile_api_chain.sh

      - name: Live pilot iOS UITests
        env:
          CI_SIGNING_HACK: "1"
          IOS_E2E_BASE_URL: ${{ steps.pilot.outputs.base_url }}
          IOS_E2E_EMAIL: ${{ secrets.PILOT_E2E_EMAIL || secrets.PILOT_SMOKE_EMAIL_PRODUCTION }}
          IOS_E2E_PASSWORD: ${{ secrets.PILOT_E2E_PASSWORD || secrets.PILOT_SMOKE_PASSWORD_PRODUCTION }}
          SMOKE_EMAIL: ${{ secrets.PILOT_E2E_EMAIL || secrets.PILOT_SMOKE_EMAIL_PRODUCTION }}
          SMOKE_PASSWORD: ${{ secrets.PILOT_E2E_PASSWORD || secrets.PILOT_SMOKE_PASSWORD_PRODUCTION }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PRODUCTION }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_PRODUCTION }}
          IOS_E2E_PROJECT_ID: ${{ secrets.PILOT_E2E_PROJECT_ID }}
        run: bash ios/scripts/run-ios-e2e-integration-local.sh
