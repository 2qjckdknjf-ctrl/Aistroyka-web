name: Android Instrumented Smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-instrumented-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build-unit:
    name: Android build + shared unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAVA_TOOL_OPTIONS: -Xmx4g
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Worker + Manager and run shared unit tests
        run: |
          cd android
          ./gradlew \
            :AiStroykaWorker:assembleDebug \
            :AiStroykaManager:assembleDebug \
            :shared:test \
            --stacktrace

  instrumented:
    name: ${{ matrix.module }} connectedDebugAndroidTest API 34
    needs: android-build-unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module:
          - AiStroykaWorker
          - AiStroykaManager
    env:
      JAVA_TOOL_OPTIONS: -Xmx4g
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Enable KVM
        run: |
          sudo tee /etc/udev/rules.d/99-kvm4all.rules <<'EOF'
          KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"
          EOF
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run ${{ matrix.module }} instrumented smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: cd android && ./gradlew :${{ matrix.module }}:connectedDebugAndroidTest --stacktrace
