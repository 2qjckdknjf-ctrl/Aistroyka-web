name: Android Instrumented Smoke

on:
  workflow_dispatch:

concurrency:
  group: android-instrumented-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-instrumented:
    name: AiStroykaWorker connectedDebugAndroidTest
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      JAVA_TOOL_OPTIONS: -Xmx4g
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Worker instrumented smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: cd android && ./gradlew :AiStroykaWorker:connectedDebugAndroidTest --stacktrace
