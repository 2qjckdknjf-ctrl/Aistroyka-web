name: Governed AI PR E2E runner (manual)

# Default-branch trusted runner. Job 1 validates trust boundary without secrets.
# Job 2 runs in protected staging environment with secrets only after preflight passes.

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Open PR number in 2qjckdknjf-ctrl/Aistroyka-web"
        required: true
        type: string
      target_sha:
        description: "Exact PR head SHA to checkout and test (40 hex chars)"
        required: true
        type: string
      preview_base_url:
        description: "Vercel Preview base URL (no trailing slash, no bypass query params)"
        required: true
        type: string
      confirmation:
        description: "Type RUN_GOVERNED_AI_STAGING_E2E to confirm"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: governed-ai-pr-e2e-${{ inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  trust-boundary-preflight:
    name: Trust boundary preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pull_request_number: ${{ steps.export.outputs.pull_request_number }}
      target_sha: ${{ steps.export.outputs.target_sha }}
      preview_base_url: ${{ steps.export.outputs.preview_base_url }}
    steps:
      - name: Validate inputs (no secrets)
        id: export
        env:
          CONFIRM: ${{ inputs.confirmation }}
          PR_NUM: ${{ inputs.pull_request_number }}
          TARGET_SHA: ${{ inputs.target_sha }}
          PREVIEW_URL: ${{ inputs.preview_base_url }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "RUN_GOVERNED_AI_STAGING_E2E" ]; then
            echo "::error::confirmation must be RUN_GOVERNED_AI_STAGING_E2E"
            exit 1
          fi
          if ! echo "$PR_NUM" | grep -Eq '^[0-9]+$'; then
            echo "::error::pull_request_number must be numeric"
            exit 1
          fi
          if ! echo "$TARGET_SHA" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "::error::target_sha must be exactly 40 lowercase hex characters"
            exit 1
          fi
          if ! echo "$PREVIEW_URL" | grep -Eq '^https://aistroyka-web-web-v7jq[a-z0-9-]*\.vercel\.app$'; then
            echo "::error::preview_base_url must be https://aistroyka-web-web-v7jq*.vercel.app"
            exit 1
          fi
          REPO="2qjckdknjf-ctrl/Aistroyka-web"
          PR_JSON="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUM}")"
          STATE="$(echo "$PR_JSON" | jq -r '.state')"
          HEAD_SHA="$(echo "$PR_JSON" | jq -r '.head.sha')"
          HEAD_REPO="$(echo "$PR_JSON" | jq -r '.head.repo.full_name')"
          BASE_REPO="$(echo "$PR_JSON" | jq -r '.base.repo.full_name')"
          IS_FORK="$(echo "$PR_JSON" | jq -r '.head.repo.fork')"
          if [ "$STATE" != "open" ]; then
            echo "::error::PR #${PR_NUM} is not open"
            exit 1
          fi
          if [ "$HEAD_REPO" != "$REPO" ] || [ "$BASE_REPO" != "$REPO" ]; then
            echo "::error::PR must be same-repository (non-fork)"
            exit 1
          fi
          if [ "$IS_FORK" = "true" ]; then
            echo "::error::Fork PRs are not allowed"
            exit 1
          fi
          if [ "$HEAD_SHA" != "$TARGET_SHA" ]; then
            echo "::error::target_sha mismatch: PR head=${HEAD_SHA} input=${TARGET_SHA}"
            exit 1
          fi
          {
            echo "pull_request_number=${PR_NUM}"
            echo "target_sha=${TARGET_SHA}"
            echo "preview_base_url=${PREVIEW_URL}"
          } >> "$GITHUB_OUTPUT"

  governed-ai-pr-e2e:
    name: Governed AI PR preview E2E
    needs: trust-boundary-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.trust-boundary-preflight.outputs.target_sha }}

      - name: Verify checked-out SHA and E2E entrypoint
        env:
          TARGET_SHA: ${{ needs.trust-boundary-preflight.outputs.target_sha }}
        run: |
          set -euo pipefail
          CURRENT="$(git rev-parse HEAD)"
          if [ "$CURRENT" != "$TARGET_SHA" ]; then
            echo "::error::Checkout SHA mismatch"
            exit 1
          fi
          test -f scripts/pilot/governed-ai-owner-evidence-staging-e2e.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.15

      - name: Secret and QA project preflight (names only)
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          WORKER_EMAIL: ${{ secrets.PILOT_SMOKE_EMAIL_STAGING }}
          WORKER_PASS: ${{ secrets.PILOT_SMOKE_PASSWORD_STAGING }}
          MANAGER_EMAIL: ${{ secrets.PILOT_E2E_MANAGER_EMAIL }}
          MANAGER_PASS: ${{ secrets.PILOT_E2E_MANAGER_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.STAKEHOLDER_SMOKE_EMAIL }}
          OWNER_PASS: ${{ secrets.STAKEHOLDER_SMOKE_PASSWORD }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_STAGING }}
          SUPABASE_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING }}
          QA_PROJECT_ID: ${{ vars.PILOT_SMOKE_PROJECT_ID_STAGING }}
        run: |
          set -euo pipefail
          missing=0
          require() { if [ -z "$2" ]; then echo "::error::Missing required: $1"; missing=1; else echo "$1=PRESENT"; fi; }
          require VERCEL_AUTOMATION_BYPASS_SECRET "$BYPASS"
          require PILOT_SMOKE_EMAIL_STAGING "$WORKER_EMAIL"
          require PILOT_SMOKE_PASSWORD_STAGING "$WORKER_PASS"
          require PILOT_E2E_MANAGER_EMAIL "$MANAGER_EMAIL"
          require PILOT_E2E_MANAGER_PASSWORD "$MANAGER_PASS"
          require STAKEHOLDER_SMOKE_EMAIL "$OWNER_EMAIL"
          require STAKEHOLDER_SMOKE_PASSWORD "$OWNER_PASS"
          require NEXT_PUBLIC_SUPABASE_URL_STAGING "$SUPABASE_URL"
          require NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING "$SUPABASE_ANON"
          require PILOT_SMOKE_PROJECT_ID_STAGING "$QA_PROJECT_ID"
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if ! echo "$QA_PROJECT_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::PILOT_SMOKE_PROJECT_ID_STAGING must be a valid UUID"
            exit 1
          fi
          if ! echo "$SUPABASE_URL" | grep -q 'vthfrxehrursfloevnlp'; then
            echo "::error::Staging Supabase URL not aligned to AISTROYKA staging ref"
            exit 1
          fi

      - name: Vercel bypass and deployment SHA preflight
        env:
          PREVIEW_URL: ${{ needs.trust-boundary-preflight.outputs.preview_base_url }}
          TARGET_SHA: ${{ needs.trust-boundary-preflight.outputs.target_sha }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          COOKIE_JAR="$(mktemp)"
          HTTP_CODE="$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            -c "$COOKIE_JAR" \
            -H "x-vercel-protection-bypass: ${BYPASS}" \
            -H "x-vercel-set-bypass-cookie: true" \
            "${PREVIEW_URL}/api/v1/health")"
          rm -f "$COOKIE_JAR"
          if [ "$HTTP_CODE" = "302" ]; then
            echo "::error::BLOCKED_VERCEL_BYPASS: Preview returned 302"
            exit 1
          fi
          if [ "$HTTP_CODE" -ge 500 ]; then
            echo "::error::FAILED_RUNTIME: Preview health HTTP ${HTTP_CODE}"
            exit 1
          fi
          BODY="$(cat /tmp/health.json)"
          SHA7="$(echo "$BODY" | jq -r '.buildStamp.sha7 // empty')"
          EXPECTED7="${TARGET_SHA:0:7}"
          if [ -z "$SHA7" ] || [ "$SHA7" != "$EXPECTED7" ]; then
            echo "::error::FAILED_DEPLOYMENT_ALIGNMENT: health sha7=${SHA7} expected=${EXPECTED7}"
            exit 1
          fi
          DB="$(echo "$BODY" | jq -r '.db // empty')"
          if [ "$DB" != "ok" ]; then
            echo "::error::Preview health db=${DB}"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run governed AI staging E2E
        env:
          GOVERNED_E2E_BASE_URL: ${{ needs.trust-boundary-preflight.outputs.preview_base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PILOT_E2E_WORKER_EMAIL: ${{ secrets.PILOT_SMOKE_EMAIL_STAGING }}
          PILOT_E2E_WORKER_PASSWORD: ${{ secrets.PILOT_SMOKE_PASSWORD_STAGING }}
          PILOT_E2E_MANAGER_EMAIL: ${{ secrets.PILOT_E2E_MANAGER_EMAIL }}
          PILOT_E2E_MANAGER_PASSWORD: ${{ secrets.PILOT_E2E_MANAGER_PASSWORD }}
          PILOT_E2E_OWNER_EMAIL: ${{ secrets.STAKEHOLDER_SMOKE_EMAIL }}
          PILOT_E2E_OWNER_PASSWORD: ${{ secrets.STAKEHOLDER_SMOKE_PASSWORD }}
          PILOT_E2E_PROJECT_ID: ${{ vars.PILOT_SMOKE_PROJECT_ID_STAGING }}
          PILOT_E2E_STAKEHOLDER_REVOKED_EMAIL: ${{ secrets.PILOT_E2E_STAKEHOLDER_REVOKED_EMAIL }}
          PILOT_E2E_STAKEHOLDER_REVOKED_PASSWORD: ${{ secrets.PILOT_E2E_STAKEHOLDER_REVOKED_PASSWORD }}
          PILOT_E2E_CROSS_TENANT_EMAIL: ${{ secrets.PILOT_E2E_CROSS_TENANT_EMAIL }}
          PILOT_E2E_CROSS_TENANT_PASSWORD: ${{ secrets.PILOT_E2E_CROSS_TENANT_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_STAGING }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING }}
          GOVERNED_E2E_MARKER: "qa-governed-e2e"
        run: |
          set -euo pipefail
          node scripts/pilot/governed-ai-owner-evidence-staging-e2e.mjs | tee e2e-result.json
          node -e "
            const fs = require('node:fs');
            const raw = JSON.parse(fs.readFileSync('e2e-result.json','utf8'));
            const redacted = {
              verdict: raw.verdict,
              base: raw.base,
              startedAt: raw.startedAt,
              deployedSha7: raw.deployedSha7,
              cleanup: raw.cleanup,
              results: (raw.results||[]).map(r => ({
                step: r.step, persona: r.persona, action: r.action,
                expected: r.expected, actual: r.actual, status: r.status,
                evidence: typeof r.evidence === 'string' ? r.evidence.replace(/https?:\\/\\/\\S+/g,'[redacted-url]') : r.evidence,
              })),
            };
            fs.writeFileSync('e2e-result-redacted.json', JSON.stringify(redacted, null, 2));
          "

      - name: Upload redacted E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: governed-ai-pr-e2e-evidence-pr${{ needs.trust-boundary-preflight.outputs.pull_request_number }}
          path: e2e-result-redacted.json
          retention-days: 14
