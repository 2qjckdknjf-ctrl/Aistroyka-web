# Minimal PR validation: install, lint, unit tests, OpenNext/Workers bundle (no deploy).
name: CI Check

on:
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Workspace preflight safety tests
        run: python3 scripts/ops/test_workspace_preflight.py

      - name: Verified migration receipt guard tests
        run: python3 scripts/ops/test_migration_receipts_preflight.py -v

      - name: Production deploy boundary tests
        run: python3 scripts/release/test_deploy_production_worker.py -v

      - name: AI deployment proof boundary tests
        run: python3 scripts/smoke/test_ai_live_provider.py -v

      # CI builds with bun; Vercel installs with npm from the root lock. Catch
      # npm-lock corruption (missing versions, macOS-only platform binaries)
      # here instead of on the next Vercel deploy.
      - name: Validate root package-lock (Vercel npm path)
        run: node scripts/ci/validate-npm-lock.cjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Isolated AI SQL access contracts
        run: |
          set -euo pipefail
          sql_test_dir="$RUNNER_TEMP/aistroyka-sql-contracts"
          mkdir -p "$sql_test_dir"
          npm install --prefix "$sql_test_dir" --ignore-scripts --no-audit --no-fund --package-lock=false @electric-sql/pglite@0.5.8
          cp scripts/ops/verify_session_analysis_postgres.mjs "$sql_test_dir/session.mjs"
          cp scripts/ops/verify_media_analysis_rls_postgres.mjs "$sql_test_dir/media.mjs"
          node "$sql_test_dir/session.mjs" "$GITHUB_WORKSPACE"
          node "$sql_test_dir/media.mjs" "$GITHUB_WORKSPACE"

      - name: i18n messages (dashboard + activation)
        run: bun run i18n:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        working-directory: apps/web
        run: bunx tsc --noEmit

      - name: Test
        run: bun run test

      - name: Release readiness policy check
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://vthfrxehrursfloevnlp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING }}
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        run: bun run release:check

      # Bake NEXT_PUBLIC_* into the OpenNext bundle (same requirement as deploy workflows).
      - name: Cloudflare bundle (no deploy)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://vthfrxehrursfloevnlp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING }}
          NEXT_PUBLIC_APP_URL: https://staging.aistroyka.ai
        run: bun run cf:build
