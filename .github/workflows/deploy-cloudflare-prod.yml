# Production deploy: successful staging workflow (or manual dispatch) → build (OpenNext) + deploy to Cloudflare Workers (env.production).
# Single install from repo root: bun install --frozen-lockfile. Build: bun run cf:build.
# Requires GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PILOT_SMOKE_BEARER_PRODUCTION; optional CRON_SECRET and smoke fallback creds.
# Blocking post-deploy gates: pilot-smoke + stakeholder finance sanity.
# Optional non-blocking: ai-phase5-gate (see PILOT_SMOKE_PROJECT_ID_PRODUCTION for stream probe).

name: Deploy Cloudflare (Production)

on:
  workflow_run:
    workflows: ["Deploy Cloudflare (Staging)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or ref to deploy (default: main). Use e.g. ops/external-setup-attempt to deploy brand branch."
        required: false
        default: "main"

# Narrow token: read commit metadata for skip-marker / SHA validation only. No write / deploy secrets here.
permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-cloudflare-prod
  cancel-in-progress: false


jobs:
  # Fail-closed before migrations/deploy so a skipped staging promotion cannot yield a green
  # production workflow with only migrations-preflight succeeding and deploy skipped.
  no-promotion-guard:
    name: Production promotion guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Load upstream commit message
        id: upstream
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "${STAGING_HEAD_SHA:-}" ]; then
            echo "message=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$STAGING_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "message=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fetch message for exact [skip-staging-deploy] detection; do not print full message.
          MSG="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${STAGING_HEAD_SHA}" --jq .commit.message)"
          {
            echo "message<<PROMOTION_GUARD_EOF"
            printf '%s\n' "$MSG"
            echo "PROMOTION_GUARD_EOF"
          } >> "$GITHUB_OUTPUT"
          if printf '%s' "$MSG" | grep -Fq '[skip-staging-deploy]'; then
            echo "has_skip_marker=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_skip_marker=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Evaluate production promotion guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          STAGING_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          STAGING_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MESSAGE: ${{ steps.upstream.outputs.message }}
        run: bash scripts/release/production-promotion-guard.sh

  migrations-preflight:
    name: Supabase migrations preflight (blocking)
    needs: [no-promotion-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Detect migrations preflight secrets
        id: migrations_preflight_inputs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "run_preflight=false" >> "$GITHUB_OUTPUT"
            echo "Supabase migration preflight skipped: SUPABASE_ACCESS_TOKEN/SUPABASE_PROJECT_REF not configured."
          else
            echo "run_preflight=true" >> "$GITHUB_OUTPUT"
            echo "Supabase migration preflight enabled."
          fi
      - name: Check env/config (migrations)
        if: ${{ steps.migrations_preflight_inputs.outputs.run_preflight == 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: bash scripts/release/check-env-config.sh migrations

  deploy:
    needs: [no-promotion-guard, migrations-preflight]
    # Defense in depth: staging must be success on workflow_run; failed no-promotion-guard skips this job.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Build and deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      deploy_ref: ${{ steps.deploy_ref.outputs.ref }}

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HUSKY: "0"

    steps:
      - name: Resolve deploy ref
        id: deploy_ref
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_run" ] && [ -n "$WORKFLOW_RUN_SHA" ]; then
            echo "ref=$WORKFLOW_RUN_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deploy ref
        env:
          DEPLOY_REF: ${{ steps.deploy_ref.outputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO_URL="https://github.com/${GITHUB_REPOSITORY}.git"

          if [ -z "$DEPLOY_REF" ]; then
            echo "::error::Deploy ref is empty. Use ref=main or a full 40-character commit SHA."
            exit 1
          fi

          # Only allow full 40-character SHA, not partial SHA.
          if echo "$DEPLOY_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            # A successful staging SHA can be an ancestor after a docs-only merge.
            # Verify the repository commit object, not equality with today's refs.
            if gh api "repos/${GITHUB_REPOSITORY}/git/commits/$DEPLOY_REF" >/dev/null 2>&1; then
              echo "Resolved deploy ref as repository commit: $DEPLOY_REF"
              exit 0
            fi

            echo "::error::Full commit SHA '$DEPLOY_REF' does not resolve to a repository commit."
            exit 1
          fi

          # Reject partial SHAs explicitly.
          if echo "$DEPLOY_REF" | grep -Eq '^[0-9a-f]{7,39}$'; then
            echo "::error::Partial commit SHA '$DEPLOY_REF' is not allowed. Use a branch, tag, or full 40-character SHA."
            exit 1
          fi

          # Exact branch match only.
          if git ls-remote --exit-code --heads "$REPO_URL" "refs/heads/$DEPLOY_REF" >/dev/null 2>&1; then
            echo "Resolved deploy ref as exact branch: refs/heads/$DEPLOY_REF"
            exit 0
          fi

          # Exact tag match only.
          if git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/$DEPLOY_REF" >/dev/null 2>&1; then
            echo "Resolved deploy ref as exact tag: refs/tags/$DEPLOY_REF"
            exit 0
          fi

          echo "::error::Requested deploy ref '$DEPLOY_REF' was not found as an exact branch, exact tag, or full 40-character commit SHA. Use e.g. ref=main."
          exit 1

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.deploy_ref.outputs.ref }}

      - name: Require CRON_SECRET for production rollout
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Repository secret CRON_SECRET is required for production rollout and blocking pilot smoke. Configure CRON_SECRET in GitHub Actions secrets."
            exit 1
          fi

      - name: Check env/config (deploy-production)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://vthfrxehrursfloevnlp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_PRODUCTION }}
          NEXT_PUBLIC_APP_URL: https://aistroyka.ai
          NEXT_PUBLIC_APP_ENV: production
          PILOT_SMOKE_BEARER: ${{ secrets.PILOT_SMOKE_BEARER_PRODUCTION }}
        run: bash scripts/release/check-env-config.sh deploy-production

      - name: Setup Node for atomic Wrangler deploy
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.15"

      - name: Install dependencies (workspace root)
        run: bun install --frozen-lockfile

      - name: Set build stamp and app env
        run: |
          echo "NEXT_PUBLIC_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BUILD_TIME=$(date -u +%Y-%m-%d\ %H:%M)" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_APP_ENV=production" >> $GITHUB_ENV

      # NEXT_PUBLIC_* must exist at next build time — they are inlined into the client bundle.
      # Worker runtime vars alone are not enough for /login and other client checks.
      - name: Build (OpenNext Cloudflare)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://vthfrxehrursfloevnlp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_PRODUCTION }}
          NEXT_PUBLIC_APP_URL: https://aistroyka.ai
          NEXT_PUBLIC_GROWTH_OS_EVENTS_URL: ${{ secrets.NEXT_PUBLIC_GROWTH_OS_EVENTS_URL }}
        run: bun run cf:build

      - name: Verify build output and app source
        working-directory: apps/web
        run: |
          echo "Build directory: $(pwd)"
          test -f .open-next/worker.js || (echo "::error::.open-next/worker.js missing" && exit 1)
          test -d .open-next/assets || (echo "::error::.open-next/assets missing" && exit 1)
          test -f "app/[locale]/(dashboard)/dashboard/page.tsx" || (echo "::error::dashboard page missing" && exit 1)
          test -f "app/[locale]/(dashboard)/layout.tsx" || (echo "::error::dashboard layout missing" && exit 1)
          echo "Worker name in wrangler (production): $(grep -A1 '^\[env.production\]' wrangler.toml | grep '^name =' | sed 's/.*= *//')"
          echo "Expected: aistroyka-web-production"

      # Production uses patched bundle so top-level __require in wrangler output stubs
      # middleware-manifest (avoids "Dynamic require of middleware-manifest.json" 500). See docs/runtime-fix.
      - name: Build deploy bundle (dry-run) and patch __require
        working-directory: apps/web
        run: |
          npx wrangler deploy --env production --dry-run --outdir .open-next/deploy
          node scripts/patch-bundle-require.cjs
      - name: Verify patched bundle (middleware-manifest stub present)
        working-directory: apps/web
        run: |
          grep -q 'x.includes("middleware") && x.includes("manifest")' .open-next/deploy/worker-bootstrap.js || (echo "::error::Patch not applied: middleware-manifest stub missing in deploy bundle" && exit 1)
          echo "Patched bundle verified."
      - name: Deploy reviewed bundle and provider secrets atomically
        working-directory: apps/web
        env:
          OPEN_NEXT_DEPLOY: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash ../../scripts/release/deploy-production-worker.sh

      - name: Post-deploy summary
        run: |
          SHA7="${NEXT_PUBLIC_BUILD_SHA:0:7}"
          echo "Deployed worker: aistroyka-web-production (apps/web)"
          echo "Commit SHA (full): $NEXT_PUBLIC_BUILD_SHA"
          echo "Commit sha7: $SHA7"
          echo "workers.dev URL: In the atomic deploy step above, look for: https://aistroyka-web-production.<account>.workers.dev"

      - name: Verify pilot smoke secret (production)
        env:
          B: ${{ secrets.PILOT_SMOKE_BEARER_PRODUCTION }}
        run: |
          if [ -z "$B" ]; then
            echo "::error::Secret PILOT_SMOKE_BEARER_PRODUCTION is empty or not configured"
            exit 1
          fi

  pilot-smoke:
    name: Post-deploy pilot smoke (blocking)
    needs: deploy
    uses: ./.github/workflows/pilot-smoke.yml
    with:
      base_url: https://aistroyka.ai
      strict_health_200: true
    # IDE may warn "Context access might be invalid" for repository secrets — false positive (vscode-github-actions #533).
    secrets:
      pilot_smoke_bearer: ${{ secrets.PILOT_SMOKE_BEARER_PRODUCTION }}
      cron_secret: ${{ secrets.CRON_SECRET }}
      smoke_email: ${{ secrets.PILOT_SMOKE_EMAIL_PRODUCTION }}
      smoke_password: ${{ secrets.PILOT_SMOKE_PASSWORD_PRODUCTION }}
      supabase_url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PRODUCTION }}
      supabase_anon_key: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_PRODUCTION }}

  stakeholder-finance-sanity:
    name: Post-deploy stakeholder finance sanity (blocking)
    needs: [deploy, pilot-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.deploy.outputs.deploy_ref }}

      - name: Require stakeholder sanity credentials
        env:
          STAKE_EMAIL: ${{ secrets.STAKEHOLDER_SMOKE_EMAIL || secrets.PILOT_SMOKE_EMAIL_PRODUCTION }}
          STAKE_PASS: ${{ secrets.STAKEHOLDER_SMOKE_PASSWORD || secrets.PILOT_SMOKE_PASSWORD_PRODUCTION }}
        run: |
          if [ -z "$STAKE_EMAIL" ] || [ -z "$STAKE_PASS" ]; then
            echo "::error::Set STAKEHOLDER_SMOKE_EMAIL/STAKEHOLDER_SMOKE_PASSWORD (or production pilot smoke credentials) for blocking finance sanity."
            exit 1
          fi

      - name: Run stakeholder finance sanity script
        env:
          STAKEHOLDER_FINANCE_BASE_URL: https://aistroyka.ai
          STAKEHOLDER_SMOKE_EMAIL: ${{ secrets.STAKEHOLDER_SMOKE_EMAIL || secrets.PILOT_SMOKE_EMAIL_PRODUCTION }}
          STAKEHOLDER_SMOKE_PASSWORD: ${{ secrets.STAKEHOLDER_SMOKE_PASSWORD || secrets.PILOT_SMOKE_PASSWORD_PRODUCTION }}
        run: bash scripts/verify/stakeholder_finance_sanity.sh

  security-headers-smoke:
    name: Post-deploy security headers (blocking)
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.deploy.outputs.deploy_ref }}
          persist-credentials: false

      - name: Run security headers smoke (www + apex, 2 consecutive)
        env:
          SECURITY_HEADERS_MAX_ATTEMPTS: "1"
          SECURITY_HEADERS_REQUIRE_CONSECUTIVE: "1"
        run: |
          set -euo pipefail
          consecutive=0
          max_pair_attempts=8
          sleep_sec=15
          require=2
          run_host() {
            local host="$1"
            env -u BASE_URL \
              SECURITY_HEADERS_BASE_URL="$host" \
              SECURITY_HEADERS_MAX_ATTEMPTS=1 \
              SECURITY_HEADERS_REQUIRE_CONSECUTIVE=1 \
              bash scripts/smoke/security_headers.sh
          }
          for attempt in $(seq 1 "$max_pair_attempts"); do
            echo "=== security headers pair attempt $attempt/$max_pair_attempts (consecutive=$consecutive) ==="
            if run_host "https://www.aistroyka.ai" \
              && run_host "https://aistroyka.ai"; then
              consecutive=$((consecutive + 1))
              echo "PAIR PASS consecutive=$consecutive/$require"
              if [[ "$consecutive" -ge "$require" ]]; then
                echo "security_headers: PASS (consecutive pair=$consecutive)"
                exit 0
              fi
            else
              consecutive=0
              echo "PAIR FAIL — consecutive reset"
            fi
            if [[ "$attempt" -lt "$max_pair_attempts" ]]; then
              sleep "$sleep_sec"
            fi
          done
          echo "::error::security_headers: FAIL — need $require consecutive www+apex passes"
          exit 1

  ai-phase5-gate:
    name: Post-deploy AI Phase 5 gate (non-blocking)
    needs: [deploy, pilot-smoke, stakeholder-finance-sanity, security-headers-smoke]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.deploy.outputs.deploy_ref }}

      - name: Run ai_phase5_gate.sh
        env:
          BASE_URL: https://aistroyka.ai
          AUTH_HEADER: Bearer ${{ secrets.PILOT_SMOKE_BEARER_PRODUCTION }}
          SMOKE_EMAIL: ${{ secrets.PILOT_SMOKE_EMAIL_PRODUCTION }}
          SMOKE_PASSWORD: ${{ secrets.PILOT_SMOKE_PASSWORD_PRODUCTION }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PRODUCTION }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_PRODUCTION }}
          PROJECT_ID: ${{ secrets.PILOT_SMOKE_PROJECT_ID_PRODUCTION }}
        run: |
          if [ -n "$PROJECT_ID" ]; then
            export INCLUDE_STREAM=1
          else
            export INCLUDE_STREAM=0
          fi
          bash scripts/smoke/ai_phase5_gate.sh

  ai-live-provider-gate:
    name: Post-deploy AI live provider gate (non-blocking)
    needs: [deploy, pilot-smoke, stakeholder-finance-sanity, security-headers-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.deploy.outputs.deploy_ref }}

      - name: Run canonical live gate
        continue-on-error: true
        env:
          BASE_URL: https://aistroyka.ai
          SMOKE_EMAIL: ${{ secrets.PILOT_SMOKE_EMAIL_PRODUCTION }}
          SMOKE_PASSWORD: ${{ secrets.PILOT_SMOKE_PASSWORD_PRODUCTION }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PRODUCTION }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_PRODUCTION }}
        run: bash scripts/smoke/ai_live_provider.sh --require-live