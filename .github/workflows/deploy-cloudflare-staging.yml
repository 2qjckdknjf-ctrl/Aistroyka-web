# Staging deploy: push to develop → build (OpenNext) + deploy to Cloudflare Workers (env.staging).
# Single install from repo root: bun install --frozen-lockfile. Build: bun run cf:build.
# Requires GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PILOT_SMOKE_BEARER_STAGING; optional CRON_SECRET.

name: Deploy Cloudflare (Staging)

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HUSKY: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Check env/config (deploy-staging)
        run: bash scripts/release/check-env-config.sh deploy-staging

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.2.15"

      - name: Install dependencies (workspace root)
        run: bun install --frozen-lockfile

      - name: Set build stamp and app env
        run: |
          echo "NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_BUILD_TIME=$(date -u +%Y-%m-%d\ %H:%M)" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_APP_ENV=staging" >> $GITHUB_ENV

      - name: Build (OpenNext Cloudflare)
        run: bun run cf:build

      - name: Verify build output and app source
        working-directory: apps/web
        run: |
          echo "Build directory: $(pwd)"
          test -f .open-next/worker.js || (echo "::error::.open-next/worker.js missing" && exit 1)
          test -d .open-next/assets || (echo "::error::.open-next/assets missing" && exit 1)
          test -f "app/[locale]/(dashboard)/dashboard/page.tsx" || (echo "::error::dashboard page missing" && exit 1)
          test -f "app/[locale]/(dashboard)/layout.tsx" || (echo "::error::dashboard layout missing" && exit 1)
          echo "Worker name (staging): $(grep -A1 '^\[env.staging\]' wrangler.toml | grep '^name =' | sed 's/.*= *//')"

      # Deploy must run from apps/web so wrangler uses apps/web/wrangler.toml
      # and entrypoint worker-bootstrap.js + .open-next/worker.js resolve (see docs/deploy-fix).
      - name: Deploy to Cloudflare (staging)
        working-directory: apps/web
        run: npx wrangler deploy --env staging --config wrangler.toml

      - name: Post-deploy summary
        run: |
          SHA7="$(echo ${{ github.sha }} | cut -c1-7)"
          echo "Deployed worker: aistroyka-web-staging (apps/web)"
          echo "Commit sha7: $SHA7"
          echo "workers.dev URL: see 'Deploy to Cloudflare (staging)' step output above"

      - name: Verify pilot smoke secret (staging)
        env:
          B: ${{ secrets.PILOT_SMOKE_BEARER_STAGING }}
        run: |
          if [ -z "$B" ]; then
            echo "::error::Secret PILOT_SMOKE_BEARER_STAGING is empty or not configured"
            exit 1
          fi

  pilot-smoke:
    name: Post-deploy pilot smoke (blocking)
    needs: deploy
    uses: ./.github/workflows/pilot-smoke.yml
    with:
      base_url: https://staging.aistroyka.ai
    # IDE may warn "Context access might be invalid" for repository secrets — false positive (vscode-github-actions #533).
    secrets:
      pilot_smoke_bearer: ${{ secrets.PILOT_SMOKE_BEARER_STAGING }}
      cron_secret: ${{ secrets.CRON_SECRET }}
