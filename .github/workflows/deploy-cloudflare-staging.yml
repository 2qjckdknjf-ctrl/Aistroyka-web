# Staging deploy: push to main → build (OpenNext) + deploy to Cloudflare Workers (env.staging).
# Single install from repo root: bun install --frozen-lockfile. Build: bun run cf:build.
# Requires GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PILOT_SMOKE_BEARER_STAGING; optional CRON_SECRET and smoke fallback creds.
# Optional non-blocking: ai-phase5-gate job (same auth secrets as pilot-smoke + staging pilot PROJECT_ID).

name: Deploy Cloudflare (Staging)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or ref to deploy (default: main)."
        required: false
        default: "main"

concurrency:
  group: deploy-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HUSKY: "0"

    steps:
      - name: Resolve deploy ref
        id: deploy_ref
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deploy ref
        env:
          DEPLOY_REF: ${{ steps.deploy_ref.outputs.ref }}
        run: |
          if echo "$DEPLOY_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Using commit SHA ref."
            exit 0
          fi

          if git ls-remote --exit-code --heads --tags "https://github.com/${GITHUB_REPOSITORY}.git" "$DEPLOY_REF" >/dev/null; then
            echo "Resolved deploy ref: $DEPLOY_REF"
          else
            echo "::error::Requested ref '$DEPLOY_REF' was not found as a branch, tag, or full commit SHA. Use e.g. ref=main."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.deploy_ref.outputs.ref }}

      - name: Check env/config (deploy-staging)
        run: bash scripts/release/check-env-config.sh deploy-staging

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.2.15"

      - name: Install dependencies (workspace root)
        run: bun install --frozen-lockfile

      - name: Set build stamp and app env
        run: |
          echo "NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_BUILD_TIME=$(date -u +%Y-%m-%d\ %H:%M)" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_APP_ENV=staging" >> $GITHUB_ENV

      # NEXT_PUBLIC_* must exist at next build time — they are inlined into the client bundle.
      - name: Build (OpenNext Cloudflare)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://vthfrxehrursfloevnlp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING }}
          NEXT_PUBLIC_APP_URL: https://staging.aistroyka.ai
        run: bun run cf:build

      - name: Verify build output and app source
        working-directory: apps/web
        run: |
          echo "Build directory: $(pwd)"
          test -f .open-next/worker.js || (echo "::error::.open-next/worker.js missing" && exit 1)
          test -d .open-next/assets || (echo "::error::.open-next/assets missing" && exit 1)
          test -f "app/[locale]/(dashboard)/dashboard/page.tsx" || (echo "::error::dashboard page missing" && exit 1)
          test -f "app/[locale]/(dashboard)/layout.tsx" || (echo "::error::dashboard layout missing" && exit 1)
          echo "Worker name (staging): $(grep -A1 '^\[env.staging\]' wrangler.toml | grep '^name =' | sed 's/.*= *//')"

      # Staging uses patched deploy bundle path (same strategy as production)
      # to avoid runtime placeholder/stub deployments and middleware-manifest require issues.
      - name: Build deploy bundle (dry-run) and patch __require
        working-directory: apps/web
        run: |
          npx wrangler deploy --env staging --dry-run --outdir .open-next/deploy
          node scripts/patch-bundle-require.cjs

      - name: Verify patched bundle (middleware-manifest stub present)
        working-directory: apps/web
        run: |
          grep -q 'x.includes("middleware") && x.includes("manifest")' .open-next/deploy/worker-bootstrap.js || (echo "::error::Patch not applied: middleware-manifest stub missing in deploy bundle" && exit 1)
          echo "Patched bundle verified."

      - name: Deploy to Cloudflare (staging, patched bundle)
        working-directory: apps/web
        env:
          OPEN_NEXT_DEPLOY: "true"
        run: npx wrangler deploy --env staging --no-bundle --config wrangler.deploy.toml

      - name: Post-deploy summary
        run: |
          SHA7="$(echo ${{ github.sha }} | cut -c1-7)"
          echo "Deployed worker: aistroyka-web-staging (apps/web)"
          echo "Commit sha7: $SHA7"
          echo "workers.dev URL: see 'Deploy to Cloudflare (staging)' step output above"

      - name: Verify pilot smoke secret (staging)
        env:
          B: ${{ secrets.PILOT_SMOKE_BEARER_STAGING }}
        run: |
          if [ -z "$B" ]; then
            echo "::error::Secret PILOT_SMOKE_BEARER_STAGING is empty or not configured"
            exit 1
          fi

  pilot-smoke:
    name: Post-deploy pilot smoke (blocking)
    needs: deploy
    uses: ./.github/workflows/pilot-smoke.yml
    with:
      base_url: https://staging.aistroyka.ai
    # IDE may warn "Context access might be invalid" for repository secrets — false positive (vscode-github-actions #533).
    secrets:
      pilot_smoke_bearer: ${{ secrets.PILOT_SMOKE_BEARER_STAGING }}
      cron_secret: ${{ secrets.CRON_SECRET }}
      smoke_email: ${{ secrets.PILOT_SMOKE_EMAIL_STAGING }}
      smoke_password: ${{ secrets.PILOT_SMOKE_PASSWORD_STAGING }}
      supabase_url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_STAGING }}
      supabase_anon_key: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING }}

  # Playwright pilot (buttons + sync + core) against staging; requires PILOT_E2E_* secrets. Non-blocking so missing secrets or UI flakiness do not fail deploy.
  pilot-e2e-audit:
    name: Post-deploy Playwright pilot E2E (optional)
    needs: pilot-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Require pilot E2E secrets
        env:
          BASE: ${{ secrets.PILOT_E2E_BASE_URL }}
          EMAIL: ${{ secrets.PILOT_E2E_EMAIL }}
          PASS: ${{ secrets.PILOT_E2E_PASSWORD }}
        run: |
          if [ -z "$BASE" ] || [ -z "$EMAIL" ] || [ -z "$PASS" ]; then
            echo "::error::Set repository secrets PILOT_E2E_BASE_URL, PILOT_E2E_EMAIL, PILOT_E2E_PASSWORD (see workflow header comments)."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build contracts (Playwright specs may import types)
        run: bun run build:contracts

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Run pilot E2E suite
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PILOT_E2E_BASE_URL }}
          PLAYWRIGHT_SKIP_WEB_SERVER: "1"
          E2E_EMAIL: ${{ secrets.PILOT_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.PILOT_E2E_PASSWORD }}
          E2E_USER_EMAIL: ${{ secrets.PILOT_E2E_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.PILOT_E2E_PASSWORD }}
          E2E_LOCALE: en
          E2E_PROJECT_ID: ${{ secrets.PILOT_E2E_PROJECT_ID }}
          E2E_DEVICE_ID: "ci-pilot-device-1"
          E2E_DEVICE_ID_2: "ci-pilot-device-2"
        run: bun run e2e:pilot

  # Phase 5: optional AI interaction probe (analyze-image + copilot stream terminal done).
  # Non-blocking: AI provider flakiness must not fail the deploy pipeline.
  ai-phase5-gate:
    name: Post-deploy AI Phase 5 gate (non-blocking)
    needs: pilot-smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Run ai_phase5_gate.sh
        env:
          BASE_URL: https://staging.aistroyka.ai
          AUTH_HEADER: Bearer ${{ secrets.PILOT_SMOKE_BEARER_STAGING }}
          SMOKE_EMAIL: ${{ secrets.PILOT_SMOKE_EMAIL_STAGING }}
          SMOKE_PASSWORD: ${{ secrets.PILOT_SMOKE_PASSWORD_STAGING }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_STAGING }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING }}
          INCLUDE_STREAM: "1"
          PROJECT_ID_STAGING_OVERRIDE: ${{ secrets.PILOT_SMOKE_PROJECT_ID_STAGING }}
        run: |
          # Default: STAGE4 Pilot Project fixture (stream probe target).
          export PROJECT_ID="${PROJECT_ID_STAGING_OVERRIDE:-a0000003-0000-4000-8000-000000000001}"
          unset PROJECT_ID_STAGING_OVERRIDE
          bash scripts/smoke/ai_phase5_gate.sh
