# Reusable blocking post-deploy pilot smoke. Called from deploy workflows (not workflow_run).
# Requires repository secrets — see docs/release/PHASE3_PILOT_SMOKE_USAGE.md

name: Pilot smoke (reusable)

on:
  workflow_call:
    inputs:
      base_url:
        description: "Public base URL (no trailing slash), e.g. https://staging.aistroyka.ai"
        required: true
        type: string
      strict_health_200:
        description: "If true, /api/v1/health must be HTTP 200 (do not accept 503)."
        required: false
        type: boolean
        default: false
    secrets:
      pilot_smoke_bearer:
        description: "Supabase JWT for a user with tenant membership (ops/metrics). No Bearer prefix."
        required: true
      cron_secret:
        description: "Optional; x-cron-secret when REQUIRE_CRON_SECRET=true on target"
        required: false
      smoke_email:
        description: "Optional; smoke user email for runtime token fallback."
        required: false
      smoke_password:
        description: "Optional; smoke user password for runtime token fallback."
        required: false
      supabase_url:
        description: "Optional; Supabase URL used with smoke credentials for token fallback."
        required: false
      supabase_anon_key:
        description: "Optional; Supabase anon key used with smoke credentials for token fallback."
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  smoke:
    name: Post-deploy pilot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check env/config (pilot-smoke)
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: bash scripts/release/check-env-config.sh pilot-smoke

      - name: Verify pilot_smoke_bearer is non-empty
        env:
          B: ${{ secrets.pilot_smoke_bearer }}
        run: |
          if [ -z "$B" ]; then
            echo "::error::Secret pilot_smoke_bearer is empty. Add the matching repository secret (PILOT_SMOKE_BEARER_STAGING or PILOT_SMOKE_BEARER_PRODUCTION) with a Supabase JWT. See docs/release/PHASE3_PILOT_SMOKE_USAGE.md"
            exit 1
          fi

      - name: Run pilot_launch.sh
        env:
          BASE_URL: ${{ inputs.base_url }}
          AUTH_HEADER: Bearer ${{ secrets.pilot_smoke_bearer }}
          CRON_SECRET: ${{ secrets.cron_secret }}
          SMOKE_EMAIL: ${{ secrets.smoke_email }}
          SMOKE_PASSWORD: ${{ secrets.smoke_password }}
          SUPABASE_URL: ${{ secrets.supabase_url }}
          SUPABASE_ANON_KEY: ${{ secrets.supabase_anon_key }}
          STRICT_HEALTH_200: ${{ inputs.strict_health_200 }}
        run: bash scripts/smoke/pilot_launch.sh
