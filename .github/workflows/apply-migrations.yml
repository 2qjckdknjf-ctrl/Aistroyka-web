# Apply Supabase migrations to a chosen target (staging or production).
# Runs ONLY on workflow_dispatch. Requires explicit operator action.
# Optional: configure GitHub Environment "production" with required reviewers for approval gate.
# See docs/closure/A1_MIGRATION_APPLY_RUNBOOK.md and A1_MIGRATION_APPLY_STRATEGY.md.

name: Apply Supabase migrations

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      ref:
        description: 'Branch or ref to use (default: main for production, develop for staging)'
        required: false
        default: ''

concurrency:
  group: apply-migrations-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply migrations (${{ github.event.inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.target }}

    steps:
      - name: Check required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it in repo or environment secrets."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF is not set for this environment. Add it in environment or repo secrets."
            exit 1
          fi
          echo "Required secrets are set (values masked)."

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || (github.event.inputs.target == 'production' && 'main' || 'develop') }}

      - name: Migration sanity check
        run: bash scripts/release/check-migrations.sh

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        working-directory: apps/web
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preflight — migration list
        working-directory: apps/web
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Local migrations (by filename):"
          ls -la supabase/migrations/*.sql 2>/dev/null | head -20 || true
          echo "---"
          supabase migration list

      - name: Dry-run (preview migrations to apply)
        working-directory: apps/web
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "--- DRY RUN: migrations that would be applied (no DB changes) ---"
          supabase db push --dry-run
          echo "--- END DRY RUN ---"

      - name: Apply migrations (db push)
        working-directory: apps/web
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "--- APPLY BOUNDARY: real db push below ---"
          supabase db push
          echo "--- APPLY COMPLETE ---"

      - name: Post-apply summary
        run: |
          echo "Target: ${{ github.event.inputs.target }}"
          echo "Ref: ${{ github.event.inputs.ref || (github.event.inputs.target == 'production' && 'main' || 'develop') }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Migrations apply job completed."
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}






