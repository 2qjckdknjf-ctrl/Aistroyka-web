# Canonical live AI provider gate (apps/web Cloudflare Worker).
# Probes production/staging vision path with tenant auth; requires non-fallback HTTP 200.
# Authoritative: scripts/smoke/ai_live_provider.sh --require-live
# See docs/ai/AUDIT_AI_VALIDATION_REPORT.md

name: AI live provider gate

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployment base URL (default https://aistroyka.ai)"
        required: false
        default: "https://aistroyka.ai"
  workflow_call:
    inputs:
      base_url:
        description: "Deployment base URL"
        required: false
        type: string
        default: "https://aistroyka.ai"
    secrets:
      PILOT_SMOKE_EMAIL_PRODUCTION:
        required: true
      PILOT_SMOKE_PASSWORD_PRODUCTION:
        required: true
      NEXT_PUBLIC_SUPABASE_URL_PRODUCTION:
        required: true
      NEXT_PUBLIC_SUPABASE_ANON_KEY_PRODUCTION:
        required: true

jobs:
  require-live:
    name: ai_live_provider --require-live
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run canonical live gate
        env:
          BASE_URL: ${{ inputs.base_url || 'https://aistroyka.ai' }}
          SMOKE_EMAIL: ${{ secrets.PILOT_SMOKE_EMAIL_PRODUCTION }}
          SMOKE_PASSWORD: ${{ secrets.PILOT_SMOKE_PASSWORD_PRODUCTION }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PRODUCTION }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_PRODUCTION }}
        run: |
          set -euo pipefail
          bash scripts/smoke/ai_live_provider.sh --require-live
