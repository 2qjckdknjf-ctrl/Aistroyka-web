name: Governed AI staging E2E (manual)

# Runs scripts/pilot/governed-ai-owner-evidence-staging-e2e.mjs against staging.
# Requires migration 20260824150000 applied on Supabase staging first.

on:
  workflow_dispatch:

jobs:
  governed-ai-staging-e2e:
    name: Governed AI owner evidence E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Require E2E credentials
        env:
          E2E_EMAIL: ${{ secrets.PILOT_E2E_EMAIL }}
          SMOKE_EMAIL: ${{ secrets.PILOT_SMOKE_EMAIL_STAGING }}
          E2E_PASS: ${{ secrets.PILOT_E2E_PASSWORD }}
          SMOKE_PASS: ${{ secrets.PILOT_SMOKE_PASSWORD_STAGING }}
        run: |
          EMAIL="${E2E_EMAIL:-$SMOKE_EMAIL}"
          PASS="${E2E_PASS:-$SMOKE_PASS}"
          if [ -z "$EMAIL" ] || [ -z "$PASS" ]; then
            echo "::error::Set PILOT_E2E_EMAIL/PASSWORD or PILOT_SMOKE_EMAIL_STAGING/PASSWORD_STAGING repository secrets."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run governed AI staging E2E script
        env:
          E2E_EMAIL: ${{ secrets.PILOT_E2E_EMAIL }}
          SMOKE_EMAIL: ${{ secrets.PILOT_SMOKE_EMAIL_STAGING }}
          E2E_PASS: ${{ secrets.PILOT_E2E_PASSWORD }}
          SMOKE_PASS: ${{ secrets.PILOT_SMOKE_PASSWORD_STAGING }}
          E2E_BASE: ${{ secrets.PILOT_E2E_BASE_URL }}
          SMOKE_BASE: ${{ secrets.PILOT_SMOKE_BASE_URL_STAGING }}
          E2E_PROJECT: ${{ secrets.PILOT_E2E_PROJECT_ID }}
          SMOKE_PROJECT: ${{ secrets.PILOT_SMOKE_PROJECT_ID_STAGING }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_STAGING }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_STAGING }}
        run: |
          export GOVERNED_E2E_BASE_URL="${E2E_BASE:-${SMOKE_BASE:-https://staging.aistroyka.ai}}"
          export PILOT_E2E_EMAIL="${E2E_EMAIL:-$SMOKE_EMAIL}"
          export PILOT_E2E_PASSWORD="${E2E_PASS:-$SMOKE_PASS}"
          export PILOT_E2E_PROJECT_ID="${E2E_PROJECT:-$SMOKE_PROJECT}"
          node scripts/pilot/governed-ai-owner-evidence-staging-e2e.mjs
