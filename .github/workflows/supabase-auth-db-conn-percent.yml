# One-shot operator workflow: switch Auth DB pool to percentage allocation.

name: Supabase Auth DB conn percent

on:
  workflow_dispatch:

jobs:
  enable-percent:
    name: Enable percentage-based Auth DB pool
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Set db_max_pool_size_unit=percent via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AUTH_DB_CONN_PERCENT: "17"
        run: node apps/web/scripts/enable-auth-db-conn-percentage.mjs
