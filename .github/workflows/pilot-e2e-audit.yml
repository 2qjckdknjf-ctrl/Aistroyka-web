# Manual Playwright pilot suite against an already-running deployment (no local next dev).
# Repository secrets (Settings → Secrets → Actions):
#   PILOT_E2E_BASE_URL   — e.g. https://staging.aistroyka.ai (no trailing slash)
#   PILOT_E2E_EMAIL      — tenant user email
#   PILOT_E2E_PASSWORD   — tenant user password
# Optional secret: PILOT_E2E_PROJECT_ID (otherwise first project from API).
name: Pilot E2E audit (manual)

on:
  workflow_dispatch:
    inputs:
      locale:
        description: "E2E_LOCALE (default en)"
        required: false
        default: "en"
        type: string

jobs:
  pilot-e2e:
    name: Playwright pilot (staging or custom URL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Require pilot E2E secrets
        env:
          BASE: ${{ secrets.PILOT_E2E_BASE_URL }}
          EMAIL: ${{ secrets.PILOT_E2E_EMAIL }}
          PASS: ${{ secrets.PILOT_E2E_PASSWORD }}
        run: |
          if [ -z "$BASE" ] || [ -z "$EMAIL" ] || [ -z "$PASS" ]; then
            echo "::error::Set repository secrets PILOT_E2E_BASE_URL, PILOT_E2E_EMAIL, PILOT_E2E_PASSWORD (see workflow header comments)."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build contracts (Playwright specs may import types)
        run: bun run build:contracts

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Run pilot E2E suite
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PILOT_E2E_BASE_URL }}
          PLAYWRIGHT_SKIP_WEB_SERVER: "1"
          E2E_EMAIL: ${{ secrets.PILOT_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.PILOT_E2E_PASSWORD }}
          E2E_USER_EMAIL: ${{ secrets.PILOT_E2E_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.PILOT_E2E_PASSWORD }}
          E2E_LOCALE: ${{ inputs.locale }}
          E2E_PROJECT_ID: ${{ secrets.PILOT_E2E_PROJECT_ID }}
          E2E_DEVICE_ID: "ci-pilot-device-1"
          E2E_DEVICE_ID_2: "ci-pilot-device-2"
        run: bun run e2e:pilot
