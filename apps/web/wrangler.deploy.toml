# Deploy pre-built patched bundle (no rebundle). Use after: wrangler deploy --dry-run --outdir .open-next/deploy && node scripts/patch-bundle-require.cjs
# Same as wrangler.toml but main points to patched bundle for production deploy with --no-bundle.

name = "aistroyka-web-dev"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "aistroyka-web-dev"

[env.dev]
name = "aistroyka-web-dev"
[env.dev.assets]
directory = ".open-next/assets"
binding = "ASSETS"
[[env.dev.services]]
binding = "WORKER_SELF_REFERENCE"
service = "aistroyka-web-dev"

[env.staging]
name = "aistroyka-web-staging"
main = ".open-next/deploy/worker-bootstrap.js"
[env.staging.vars]
NEXT_PUBLIC_SUPABASE_URL = "https://vthfrxehrursfloevnlp.supabase.co"
NEXT_PUBLIC_APP_URL = "https://staging.aistroyka.ai"
AI_ANALYSIS_URL = "https://staging.aistroyka.ai/api/ai/analyze-image"
[env.staging.assets]
directory = ".open-next/assets"
binding = "ASSETS"
[[env.staging.services]]
binding = "WORKER_SELF_REFERENCE"
service = "aistroyka-web-staging"

[env.production]
name = "aistroyka-web-production"
main = ".open-next/deploy/worker-bootstrap.js"

[env.production.vars]
NEXT_PUBLIC_SUPABASE_URL = "https://vthfrxehrursfloevnlp.supabase.co"
# Required at runtime for health, middleware, auth. Set NEXT_PUBLIC_SUPABASE_ANON_KEY in Dashboard (secret).
NEXT_PUBLIC_APP_URL = "https://aistroyka.ai"
AI_ANALYSIS_URL = "https://aistroyka.ai/api/ai/analyze-image"
# Align with working copilot model tier; gpt-4o may be unavailable on some OpenAI projects.
OPENAI_VISION_MODEL = "gpt-4o-mini"
# Phase 3 only — do NOT enable during Phase 1 admin domain bring-up:
# OWNER_ALLOWED_HOSTS = "admin.aistroyka.ai"

[env.production.assets]
directory = ".open-next/assets"
binding = "ASSETS"
[[env.production.services]]
binding = "WORKER_SELF_REFERENCE"
service = "aistroyka-web-production"
